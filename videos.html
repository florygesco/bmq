const PUBLITIO_URL="https://api.publit.io/v1/files/create/cbnwpcbP";
const VIDEO_MAX=500*1024*1024;

function uploadToPublitio(file,onProgress){
if(!file.type||!file.type.startsWith("video/"))return Promise.reject(new Error("Veuillez sélectionner une vidéo."));
if(file.size>VIDEO_MAX)return Promise.reject(new Error("La vidéo dépasse 500 Mo."));
return new Promise(function(resolve,reject){
var xhr=new XMLHttpRequest();
var form=new FormData();
form.append("file",file);
xhr.upload.onprogress=function(e){if(e.lengthComputable)onProgress(Math.round(e.loaded/e.total*100));};
xhr.onload=function(){
if(xhr.status<200||xhr.status>=300){reject(new Error("Échec de l'envoi (HTTP "+xhr.status+")."));return;}
try{
var raw=JSON.parse(xhr.responseText);
if(raw&&raw.success===false){reject(new Error("Publitio : "+((raw.error&&raw.error.message)||"Erreur")));return;}
var data=(raw&&raw.response)?raw.response:raw;
var publitioId=data.id||data.publitio_id||null;
var videoUrl=publitioId?("https://FloryNgenda.publit.io/file/"+publitioId+".mp4"):null;
var thumbnailUrl=data.url_thumbnail||data.thumbnail_url||null;
if(!publitioId||!videoUrl){reject(new Error("Réponse Publitio incomplète."));return;}
resolve({publitioId:publitioId,videoUrl:videoUrl,thumbnailUrl:thumbnailUrl});
}catch(e){reject(new Error("Réponse Publitio invalide."));}
};
xhr.onerror=function(){reject(new Error("Erreur réseau."));};
xhr.open("POST",PUBLITIO_URL);
xhr.send(form);
});
}

async function convertirEnMP4(file,onProgress){
var nom=file.name.toLowerCase();
if(nom.endsWith('.mp4')&&(file.type==='video/mp4'||file.type===''))return file;
onProgress(0,'Préparation…');
var FF=window.FFmpeg;
if(!FF)throw new Error("Convertisseur indisponible.");
var ffmpeg=FF.createFFmpeg({log:false,corePath:'https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js'});
ffmpeg.setProgress(function(p){if(p&&p.ratio&&p.ratio>0){var pct=10+Math.round(p.ratio*80);onProgress(pct,'Conversion… '+Math.round(p.ratio*100)+' %');}});
try{
if(!ffmpeg.isLoaded()){onProgress(3,'Chargement…');await ffmpeg.load();}
onProgress(8,'Lecture…');
var extMatch=nom.match(/\.[^.]+$/);
var inputName='input'+(extMatch?extMatch[0]:'.mov');
ffmpeg.FS('writeFile',inputName,await FF.fetchFile(file));
onProgress(10,'Conversion en MP4…');
await ffmpeg.run('-i',inputName,'-c:v','libx264','-preset','ultrafast','-crf','28','-c:a','aac','-b:a','128k','-movflags','+faststart','output.mp4');
onProgress(92,'Finalisation…');
var data=ffmpeg.FS('readFile','output.mp4');
var mp4Blob=new Blob([data.buffer],{type:'video/mp4'});
if(mp4Blob.size<1024)throw new Error("Conversion échouée.");
var mp4File=new File([mp4Blob],(nom.replace(/\.[^.]+$/,'')||'video')+'.mp4',{type:'video/mp4'});
try{ffmpeg.FS('unlink',inputName);}catch(e){}
try{ffmpeg.FS('unlink','output.mp4');}catch(e){}
onProgress(100,'✅ Terminée');
return mp4File;
}catch(err){throw new Error("Conversion impossible : "+(err.message||err)+".");}
}

let currentUser=null;
let selectedFile=null;
let unsubFeed=null;
let unsubMine=null;

function toast(msg){
var t=document.getElementById('toast');
t.textContent=msg;
t.classList.add('show');
clearTimeout(window._toastTimer);
window._toastTimer=setTimeout(function(){t.classList.remove('show');},3200);
}
function esc(s){if(!s)return'';return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function showPage(name){
document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
var el=document.getElementById('page-'+name);
if(el)el.classList.add('active');
}
window.switchTab=function(tab){
document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});
showPage(tab);
if(tab==='feed')startFeed();
if(tab==='profil')startMyVideos();
};

window.handleLogin=async function(){
var email=document.getElementById('authEmail').value.trim();
var pwd=document.getElementById('authPassword').value;
var errBox=document.getElementById('authError');
errBox.style.display='none';
if(!email||!pwd){toast('Remplissez tous les champs.');return;}
var btn=document.getElementById('btnLogin');
btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Connexion…';
try{await signInWithEmailAndPassword(auth,email,pwd);}
catch(e){errBox.textContent=traduireErreur(e.code||e.message);errBox.style.display='block';}
finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter';}
};
window.handleSignup=async function(){
var email=document.getElementById('authEmail').value.trim();
var pwd=document.getElementById('authPassword').value;
var errBox=document.getElementById('authError');
errBox.style.display='none';
if(!email||!pwd){toast('Remplissez tous les champs.');return;}
if(pwd.length<6){toast('Mot de passe : 6 caractères minimum.');return;}
var btn=document.getElementById('btnSignup');
btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Création…';
try{await createUserWithEmailAndPassword(auth,email,pwd);}
catch(e){errBox.textContent=traduireErreur(e.code||e.message);errBox.style.display='block';}
finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-user-plus"></i> Créer un compte';}
};
window.handleLogout=async function(){
if(unsubFeed){unsubFeed();unsubFeed=null;}
if(unsubMine){unsubMine();unsubMine=null;}
if(videoObserver){videoObserver.disconnect();videoObserver=null;}
await signOut(auth);
toast('Déconnecté');
};
function traduireErreur(code){
var map={
'auth/invalid-email':'Email invalide.',
'auth/user-not-found':'Aucun compte.',
'auth/wrong-password':'Mot de passe incorrect.',
'auth/invalid-credential':'Email ou mot de passe incorrect.',
'auth/email-already-in-use':'Email déjà utilisé.',
'auth/weak-password':'Mot de passe trop faible.',
'auth/too-many-requests':'Trop de tentatives.',
'auth/network-request-failed':'Erreur réseau.'
};
return map[code]||'Erreur : '+code;
}

window.ouvrirPublier=function(){
document.getElementById('videoFileInput').value='';
document.getElementById('videoPickerLabel').textContent='Choisir une vidéo';

document.getElementById('videoProgressZone').style.display='none';

window.fermerPublier=function(){document.getElementById('publishModal').classList.remove('active');};

window.onVideoSelected=function(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
if(!f.type.startsWith('video/')){toast('Veuillez choisir une vidéo.');e.target.value='';return;}
if(f.size>VIDEO_MAX){toast('Vidéo trop lourde (max 500 Mo).');e.target.value='';return;}
var isMP4=f.name.toLowerCase().endsWith('.mp4');
if(!isMP4&&f.size>80*1024*1024){toast('Vidéo non-MP4 trop lourde. Convertissez-la en MP4.');e.target.value='';return;}
selectedFile=f;
var nom=f.name.length>32?f.name.slice(0,29)+'…':f.name;
document.getElementById('videoPickerLabel').textContent=(isMP4?'✅ ':'⏳ ')+nom+(isMP4?'':' (sera converti)');
};

window.lancerPublication=async function(){
if(!currentUser){toast('Connectez-vous.');return;}
if(!selectedFile){toast('Choisissez une vidéo.');return;}
var isNonMP4=!selectedFile.name.toLowerCase().endsWith('.mp4');
if(isNonMP4){
var c=confirm('⏳ Cette vidéo va être convertie en MP4.\n\nDurée : 1 à 5 min.\nNe fermez pas l\'app.\n\nContinuer ?');
if(!c)return;
}
var desc=document.getElementById('videoDescription').value.trim();
var btn=document.getElementById('videoPublishBtn');
var zone=document.getElementById('videoProgressZone');
var bar=document.getElementById('videoProgressBar');
var txt=document.getElementById('videoProgressText');
var errBox=document.getElementById('videoError');
errBox.style.display='none';
zone.style.display='block';
bar.style.width='0%';
txt.textContent='0 %';
btn.disabled=true;
btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Préparation…';
try{
var fichierFinal=await convertirEnMP4(selectedFile,function(pct,msg){bar.style.width=pct+'%';txt.textContent=msg||(pct+' %');});
btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Envoi…';
bar.style.width='0%';
txt.textContent='Envoi… 0 %';
var pub=await uploadToPublitio(fichierFinal,function(pct){bar.style.width=pct+'%';txt.textContent='Envoi… '+pct+' %';});
var videoData={
ownerUid:currentUser.uid,
ownerEmail:userEmailShort,
publitioId:pub.publitioId,
videoUrl:pub.videoUrl,
description:desc||"",
createdAt:serverTimestamp(),
accountType:'creator',
status:'published',
validViews:0
};
if(pub.thumbnailUrl)videoData.thumbnailUrl=pub.thumbnailUrl;
Object.keys(videoData).forEach(function(k){if(videoData[k]===undefined)delete videoData[k];});
await addDoc(collection(db,'videos'),videoData);
toast('✅ Vidéo publiée !');
fermerPublier();
setTimeout(function(){switchTab('feed');},500);
}catch(e){
errBox.textContent=e.message||'Échec de la publication.';
errBox.style.display='block';
}finally{
btn.disabled=false;
btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> Publier la vidéo';
}
};

window.incrementerVue=async function(videoId,event){
event.stopPropagation();
if(!currentUser)return;
var btn=event.currentTarget;
btn.disabled=true;
try{
await updateDoc(doc(db,'videos',videoId),{validViews:increment(1)});
toast('+1 vue');
}catch(e){
toast('Erreur : '+e.message);
}finally{
setTimeout(function(){btn.disabled=false;},800);
}
};

function renderVideoItem(v,isMine){
var dateStr='Récemment';
if(v.createdAt&&v.createdAt.seconds){
var d=new Date(v.createdAt.seconds*1000);
dateStr=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
var posterAttr=v.thumbnailUrl?' poster="'+esc(v.thumbnailUrl)+'"':'';
var initials=(v.ownerEmail||'N').slice(0,2).toUpperCase();
var descHtml=v.description?'<p class="feed-desc">'+esc(v.description)+'</p>':'';
var incBtn=isMine?'<button class="btn-inc-view" onclick="incrementerVue(\''+v.id+'\',event)" aria-label="Incrémenter"><i class="fa-solid fa-eye"></i><span>+1</span></button>':'';
return'<div class="feed-item" data-vid="'+v.id+'">'+
'<video src="'+esc(v.videoUrl)+'"'+posterAttr+' loop muted playsinline webkit-playsinline preload="metadata" crossorigin="anonymous" onclick="togglePlay(this)"></video>'+
incBtn+
'<div class="feed-overlay">'+
'<div class="feed-user">'+
'<div class="feed-avatar">'+esc(initials)+'</div>'+
'<div><div class="feed-user-name">'+(isMine?'Moi':esc(v.ownerEmail||'Utilisateur'))+'</div><div class="feed-user-date">'+dateStr+'</div></div>'+
'</div>'+
descHtml+
'<div class="feed-views"><i class="fa-solid fa-eye"></i> <span data-views="'+v.id+'">'+(v.validViews||0)+'</span> vue'+((v.validViews||0)===1?'':'s')+'</div>'+
'</div>'+
'</div>';
}
window.togglePlay=function(v){
if(v.paused)v.play();else v.pause();
};

function detectOrientation(videoEl,parentEl){
function apply(){
var w=videoEl.videoWidth||1,h=videoEl.videoHeight||1;
if(h>w){parentEl.classList.add('portrait');parentEl.classList.remove('landscape');}
else{parentEl.classList.add('landscape');parentEl.classList.remove('portrait');}
}
if(videoEl.readyState>=1)apply();
else videoEl.addEventListener('loadedmetadata',apply,{once:true});
}

function setupVideoObservers(){
if(videoObserver)videoObserver.disconnect();
if(!('IntersectionObserver' in window))return;
videoObserver=new IntersectionObserver(function(entries){
entries.forEach(function(e){
var video=e.target.querySelector('video');
if(!video)return;
if(e.isIntersecting){
video.muted=true;
video.play().catch(function(){});
}else{
video.pause();
}
});
},{threshold:0.6});
document.querySelectorAll('.feed-item').forEach(function(item){
videoObserver.observe(item);
var video=item.querySelector('video');
if(video){detectOrientation(video,item);video.addEventListener('loadedmetadata',function(){detectOrientation(video,item);});}
});
}

function startFeed(){
var el=document.getElementById('feedListe');
el.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#94a3b8"><i class="fa-solid fa-spinner fa-spin"></i></div>';
if(unsubFeed){unsubFeed();unsubFeed=null;}
var q=query(collection(db,'videos'),orderBy('createdAt','desc'),limit(30));
unsubFeed=onSnapshot(q,function(snap){
var list=[];
snap.forEach(function(d){list.push(Object.assign({id:d.id},d.data()));});
if(list.length===0){
el.innerHTML='<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;padding:20px;text-align:center"><div style="font-size:64px;margin-bottom:16px">🎬</div><h2 style="color:#f1f5f9;font-size:18px;margin:0 0 8px">Aucune vidéo</h2><p style="font-size:14px;margin:0 0 20px">Soyez le premier à publier !</p><button class="btn btn-blue" onclick="switchTab(\'profil\')"><i class="fa-solid fa-plus"></i> Publier</button></div>';
return;
}
el.innerHTML=list.map(function(v){return renderVideoItem(v,v.ownerUid===currentUser.uid);}).join('');
setupVideoObservers();
},function(err){
el.innerHTML='<div style="padding:40px;color:#ef4444;text-align:center">Erreur : '+esc(err.message)+'</div>';
});
}

window.supprimerVideo=async function(videoId){
if(!confirm('Supprimer cette vidéo ?'))return;
try{
await deleteDoc(doc(db,'videos',videoId));
toast('Vidéo supprimée');
}catch(e){toast('Erreur : '+e.message);}
};

function startMyVideos(){
var el=document.getElementById('mesVideosListe');
if(!currentUser){el.innerHTML='';return;}
el.innerHTML='<div style="text-align:center;padding:40px;color:#94a3b8"><i class="fa-solid fa-spinner fa-spin"></i></div>';
if(unsubMine){unsubMine();unsubMine=null;}
var q=query(collection(db,'videos'),where('ownerUid','==',currentUser.uid));
unsubMine=onSnapshot(q,function(snap){
var list=[];
snap.forEach(function(d){list.push(Object.assign({id:d.id},d.data()));});
list.sort(function(a,b){return(b.createdAt&&b.createdAt.seconds||0)-(a.createdAt&&a.createdAt.seconds||0);});
var totalViews=list.reduce(function(s,v){return s+(v.validViews||0);},0);
document.getElementById('statVideos').textContent=list.length;
document.getElementById('statVues').textContent=totalViews;
if(list.length===0){
el.innerHTML='<div style="text-align:center;padding:40px 20px;background:#0f172a;border-radius:12px;border:1px dashed #334155"><div style="font-size:48px;opacity:.4;margin-bottom:12px">📹</div><p style="font-size:14px;color:#94a3b8;margin:0">Aucune vidéo publiée</p></div>';
return;
}
el.innerHTML=list.map(function(v){
var thumb=v.thumbnailUrl?'<img src="'+esc(v.thumbnailUrl)+'" loading="lazy">':'🎬';
return'<div class="video-list-item">'+
'<div class="video-list-thumb">'+thumb+'</div>'+
'<div class="video-list-info">'+
'<p class="video-list-desc">'+esc(v.description||'Sans description')+'</p>'+
'<div class="video-list-meta"><span><i class="fa-solid fa-eye"></i> '+(v.validViews||0)+'</span></div>'+
'</div>'+
'<button class="btn-del" onclick="supprimerVideo(\''+v.id+'\')"><i class="fa-solid fa-trash"></i></button>'+
'</div>';
}).join('');
},function(err){
el.innerHTML='<div class="error-box">Erreur : '+esc(err.message)+'</div>';
});
}

onAuthStateChanged(auth,function(user){
currentUser=user;
if(user){
userEmailShort=user.email||'';
document.getElementById('authScreen').style.display='none';
document.getElementById('tabBar').style.display='grid';
document.getElementById('profilEmail').textContent=user.email;
switchTab('feed');
}else{
document.getElementById('authScreen').style.display='flex';
document.getElementById('tabBar').style.display='none';
if(unsubFeed){unsubFeed();unsubFeed=null;}
if(unsubMine){unsubMine();unsubMine=null;}
}
});
