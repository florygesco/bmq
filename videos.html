<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NeTubeX Vidéo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100%;height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.page{display:none;width:100%;height:100%}
.page.active{display:block}
#page-feed{position:relative;width:100%;height:100%;height:100dvh;background:#000}
#feedListe{width:100%;height:100%;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#feedListe::-webkit-scrollbar{display:none}
.video-card{position:relative;width:100%;height:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden;flex-shrink:0}
.video-frame{position:absolute;inset:0;width:100%;height:100%;background:#000}
.video-frame video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.play-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.15);cursor:pointer;z-index:5}
.play-overlay.visible{display:flex}
.play-overlay .play-btn{width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;font-size:32px;color:#0f172a;box-shadow:0 8px 32px rgba(0,0,0,.6);transition:transform .15s}
.play-overlay:active .play-btn{transform:scale(.9)}
.feed-overlay{position:absolute;left:0;right:0;bottom:0;padding:80px 16px 20px;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 50%,transparent 100%);pointer-events:none;z-index:3}
.feed-overlay>*{pointer-events:auto}
.feed-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feed-avatar{width:42px;height:42px;border-radius:50%;background:#2563EB;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.feed-user-name{font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.feed-user-date{font-size:12px;color:rgba(255,255,255,.75);font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.feed-desc{font-size:15px;line-height:1.45;color:#fff;margin:0 0 12px;text-shadow:0 1px 3px rgba(0,0,0,.9);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:calc(100% - 80px)}
.feed-views{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;font-weight:800;color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-inc-view{position:absolute;right:14px;bottom:200px;width:56px;height:56px;border-radius:50%;background:rgba(37,99,235,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.4);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 6px 20px rgba(0,0,0,.6);z-index:4;font-family:inherit;font-weight:900;line-height:1;transition:transform .12s}
.btn-inc-view:active{transform:scale(.88)}
.btn-inc-view:disabled{opacity:.5}
.btn-inc-view i{font-size:18px}
.btn-inc-view span{font-size:11px}
.feed-top-bar{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:6;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,transparent 100%)}
.feed-top-bar>*{pointer-events:auto}
.feed-top-logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.feed-top-logo span{color:#3B82F6}
.feed-top-btn{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px}
.header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:22px;font-weight:900;letter-spacing:-.5px;color:#0f172a}
.header-title span{color:#2563EB}
.btn{padding:14px 20px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:#2563EB;color:#fff}
.btn-green{background:#10b981;color:#fff}
.btn-red{background:#ef4444;color:#fff}
.btn-sm{padding:10px 14px;font-size:13px;border-radius:10px}
.input{width:100%;padding:14px 16px;border-radius:12px;background:#fff;border:2px solid #e2e8f0;color:#0f172a;font-size:16px;font-family:inherit;outline:none}
.input:focus{border-color:#2563EB}
.label{display:block;font-size:12px;font-weight:900;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px}
.auth-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto;background:#f8fafc}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,14,26,0.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{padding:12px 8px 10px;background:transparent;border:none;cursor:pointer;color:#64748b;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;transition:color .15s}
.tab-btn i{font-size:20px}
.tab-btn.active{color:#3B82F6}
.toast{position:fixed;top:80px;left:50%;transform:translate(-50%,-180%);background:#0f172a;color:#fff;padding:14px 22px;border-radius:12px;font-size:14px;font-weight:700;z-index:900;transition:transform .3s ease;max-width:85vw;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.35);border:1px solid rgba(255,255,255,.1)}
.toast.show{transform:translate(-50%,0)}
.progress-wrap{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#2563EB,#3B82F6);transition:width .2s}
.error-box{padding:12px 14px;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;color:#991b1b;font-weight:700;font-size:14px;margin-bottom:12px;word-break:break-word}
.picker-zone{border:2px dashed #cbd5e1;border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;background:#f8fafc;margin-bottom:16px}
.picker-zone:hover{border-color:#2563EB;background:#eff6ff}
.picker-zone .icon{font-size:40px;margin-bottom:8px}
.picker-zone .title{font-size:15px;font-weight:800;color:#0f172a}
.picker-zone .hint{font-size:13px;color:#64748b;margin-top:4px}
.main-content{padding:16px;padding-bottom:90px;max-width:600px;margin:0 auto}
#page-publish,#page-profil{background:#f8fafc;color:#0f172a}
</style>
</head>
<body>

<div id="page-auth" class="page active">
<div class="auth-screen">
<h1 style="font-size:38px;font-weight:900;text-align:center;margin:0 0 6px;letter-spacing:-1.5px;color:#0f172a">NeTube<span style="color:#2563EB">X</span></h1>
<p style="text-align:center;color:#64748b;font-size:14px;margin:0 0 28px;font-weight:600">Chaque vidéo compte.</p>
<div id="authError" class="error-box" style="display:none"></div>
<div style="display:flex;flex-direction:column;gap:12px">
<input id="authEmail" type="email" class="input" placeholder="Email" autocomplete="email">
<input id="authPassword" type="password" class="input" placeholder="Mot de passe (min. 6)" autocomplete="current-password">
<button id="btnLogin" class="btn btn-blue" style="width:100%" onclick="handleLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter</button>
<button id="btnSignup" class="btn btn-green" style="width:100%" onclick="handleSignup()"><i class="fa-solid fa-user-plus"></i> Créer un compte</button>
</div>
<p style="text-align:center;color:#94a3b8;font-size:12px;margin-top:24px">En continuant, vous acceptez les conditions NeTubeX.</p>
</div>
</div>

<div id="page-feed" class="page">
<div class="feed-top-bar">
<div class="feed-top-logo">NeTube<span>X</span></div>
<button class="feed-top-btn" onclick="switchTab('profil')"><i class="fa-solid fa-user"></i></button>
</div>
<div id="feedListe"></div>
</div>

<div id="page-publish" class="page">
<div class="header"><div class="header-title">Publier une vidéo</div></div>
<div class="main-content">
<div class="card">
<div class="picker-zone" onclick="document.getElementById('videoFileInput').click()">
<div class="icon">🎬</div>
<div id="videoPickerLabel" class="title">Choisir une vidéo</div>
<div class="hint">MP4, WebM, MOV · max 500 Mo</div>
<input type="file" id="videoFileInput" accept="video/*" style="display:none" onchange="onVideoSelected(event)">
</div>
<label class="label">Description</label>
<textarea id="videoDescription" class="input" rows="3" maxlength="300" placeholder="Décrivez votre vidéo…" style="resize:none;margin-bottom:16px;font-family:inherit"></textarea>
<div id="videoProgressZone" style="display:none;margin-bottom:16px">
<div class="progress-wrap"><div id="videoProgressBar" class="progress-bar"></div></div>
<div id="videoProgressText" style="font-size:13px;font-weight:800;color:#64748b;margin-top:8px;text-align:center">0 %</div>
</div>
<div id="videoError" class="error-box" style="display:none"></div>
<button id="videoPublishBtn" class="btn btn-green" style="width:100%" onclick="lancerPublication()"><i class="fa-solid fa-paper-plane"></i> Publier la vidéo</button>
</div>
</div>
</div>

<div id="page-profil" class="page">
<div class="header">
<div class="header-title">Mon profil</div>
<button class="btn btn-red btn-sm" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
</div>
<div class="main-content">
<div class="card" style="margin-bottom:16px">
<div style="display:flex;align-items:center;gap:14px">
<div style="width:60px;height:60px;border-radius:50%;background:#2563EB;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex-shrink:0"><i class="fa-solid fa-user"></i></div>
<div style="min-width:0;flex:1">
<div id="profilEmail" style="font-size:16px;font-weight:800;word-break:break-all;color:#0f172a">—</div>
<div style="font-size:13px;color:#64748b;margin-top:2px">Compte NeTubeX</div>
</div>
</div>
</div>
<h2 style="font-size:18px;font-weight:900;margin:0 0 12px;color:#0f172a"><i class="fa-solid fa-video" style="color:#2563EB;margin-right:6px"></i> Mes vidéos</h2>
<div id="mesVideosListe"></div>
</div>
</div>

<div id="tabBar" class="tab-bar" style="display:none">
<button class="tab-btn active" data-tab="feed" onclick="switchTab('feed')"><i class="fa-solid fa-house"></i><span>Accueil</span></button>
<button class="tab-btn" data-tab="publish" onclick="switchTab('publish')"><i class="fa-solid fa-plus-circle"></i><span>Publier</span></button>
<button class="tab-btn" data-tab="profil" onclick="switchTab('profil')"><i class="fa-solid fa-user"></i><span>Profil</span></button>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, query, orderBy, onSnapshot, serverTimestamp, where, limit, increment } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain: "netubexmoney.firebaseapp.com",
projectId: "netubexmoney",
storageBucket: "netubexmoney.firebasestorage.app",
messagingSenderId: "856592608176",
appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const PUBLITIO_PRESET = "cbnwpcbP";
const PUBLITIO_UPLOAD_URL = `https://api.publit.io/v1/files/create/${PUBLITIO_PRESET}`;
const VIDEO_MAX_SIZE = 500 * 1024 * 1024;

function uploadToPublitio(file, onProgress) {
if (!file.type || !file.type.startsWith("video/")) return Promise.reject(new Error("Veuillez sélectionner une vidéo."));
if (file.size > VIDEO_MAX_SIZE) return Promise.reject(new Error("La vidéo dépasse 500 Mo."));
return new Promise(function(resolve, reject) {
var xhr = new XMLHttpRequest();
var form = new FormData();
form.append("file", file);
xhr.upload.onprogress = function(e) { if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
xhr.onload = function() {
if (xhr.status < 200 || xhr.status >= 300) { reject(new Error("Échec de l'envoi (HTTP " + xhr.status + ").")); return; }
try {
var raw = JSON.parse(xhr.responseText);
if (raw && raw.success === false) { reject(new Error("Publitio : " + ((raw.error && raw.error.message) || "Erreur"))); return; }
var data = (raw && raw.response) ? raw.response : raw;
var videoUrl = data.url_preview || data.url_mp4 || data.url || null;
var publitioId = data.id || data.publitio_id || null;
var thumbnailUrl = data.url_thumbnail || data.thumbnail_url || null;
if (!publitioId || !videoUrl) { reject(new Error("Réponse Publitio incomplète.")); return; }
resolve({ publitioId: publitioId, videoUrl: videoUrl, thumbnailUrl: thumbnailUrl });
} catch (e) { reject(new Error("Réponse Publitio invalide.")); }
};
xhr.onerror = function() { reject(new Error("Erreur réseau.")); };
xhr.open("POST", PUBLITIO_UPLOAD_URL);
xhr.send(form);
});
}

let currentUser = null;
let selectedFile = null;
let unsubFeed = null;
let unsubMine = null;
let videoObserver = null;

function toast(msg) {
var t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
clearTimeout(window._toastTimer);
window._toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3200);
}
function esc(s) {
if (!s) return '';
return String(s).replace(/[&<>"']/g, function(m) {
return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
});
}
function showPage(name) {
document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
var el = document.getElementById('page-' + name);
if (el) el.classList.add('active');
window.scrollTo(0, 0);
}
window.switchTab = function(tab) {
document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === tab); });
showPage(tab);
if (tab === 'feed') startFeed();
if (tab === 'profil') startMyVideos();
if (tab === 'publish') resetPublishForm();
};

window.handleLogin = async function() {
var email = document.getElementById('authEmail').value.trim();
var pwd = document.getElementById('authPassword').value;
var errBox = document.getElementById('authError');
errBox.style.display = 'none';
if (!email || !pwd) { toast('Remplissez tous les champs.'); return; }
var btn = document.getElementById('btnLogin');
btn.disabled = true;
btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion…';
try { await signInWithEmailAndPassword(auth, email, pwd); }
catch (e) { errBox.textContent = traduireErreur(e.code || e.message); errBox.style.display = 'block'; }
finally { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter'; }
};
window.handleSignup = async function() {
var email = document.getElementById('authEmail').value.trim();
var pwd = document.getElementById('authPassword').value;
var errBox = document.getElementById('authError');
errBox.style.display = 'none';
if (!email || !pwd) { toast('Remplissez tous les champs.'); return; }
if (pwd.length < 6) { toast('Mot de passe : 6 caractères minimum.'); return; }
var btn = document.getElementById('btnSignup');
btn.disabled = true;
btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Création…';
try { await createUserWithEmailAndPassword(auth, email, pwd); }
catch (e) { errBox.textContent = traduireErreur(e.code || e.message); errBox.style.display = 'block'; }
finally { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Créer un compte'; }
};
window.handleLogout = async function() {
if (unsubFeed) { unsubFeed(); unsubFeed = null; }
if (unsubMine) { unsubMine(); unsubMine = null; }
if (videoObserver) { videoObserver.disconnect(); videoObserver = null; }
await signOut(auth);
toast('Déconnecté');
};
function traduireErreur(code) {
var map = {
'auth/invalid-email': 'Email invalide.',
'auth/user-not-found': 'Aucun compte avec cet email.',
'auth/wrong-password': 'Mot de passe incorrect.',
'auth/invalid-credential': 'Email ou mot de passe incorrect.',
'auth/email-already-in-use': 'Cet email est déjà utilisé.',
'auth/weak-password': 'Mot de passe trop faible.',
'auth/too-many-requests': 'Trop de tentatives.',
'auth/network-request-failed': 'Erreur réseau.'
};
return map[code] || 'Erreur : ' + code;
}

window.resetPublishForm = function() {
selectedFile = null;
document.getElementById('videoFileInput').value = '';
document.getElementById('videoPickerLabel').textContent = 'Choisir une vidéo';
document.getElementById('videoDescription').value = '';
document.getElementById('videoProgressZone').style.display = 'none';
document.getElementById('videoProgressBar').style.width = '0%';
document.getElementById('videoProgressText').textContent = '0 %';
document.getElementById('videoError').style.display = 'none';
};
window.onVideoSelected = function(e) {
var f = e.target.files && e.target.files[0];
if (!f) return;
if (!f.type.startsWith('video/')) { toast('Veuillez choisir une vidéo.'); e.target.value = ''; return; }
if (f.size > VIDEO_MAX_SIZE) { toast('Vidéo trop lourde (max 500 Mo).'); e.target.value = ''; return; }
selectedFile = f;
var nom = f.name.length > 32 ? f.name.slice(0, 29) + '…' : f.name;
document.getElementById('videoPickerLabel').textContent = '✅ ' + nom;
};
window.lancerPublication = async function() {
if (!currentUser) { toast('Connectez-vous.'); return; }
if (!selectedFile) { toast('Choisissez une vidéo.'); return; }
var desc = document.getElementById('videoDescription').value.trim();
var btn = document.getElementById('videoPublishBtn');
var zone = document.getElementById('videoProgressZone');
var bar = document.getElementById('videoProgressBar');
var txt = document.getElementById('videoProgressText');
var errBox = document.getElementById('videoError');
errBox.style.display = 'none';
zone.style.display = 'block';
btn.disabled = true;
btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Envoi…';
try {
var pub = await uploadToPublitio(selectedFile, function(pct) { bar.style.width = pct + '%'; txt.textContent = pct + ' %'; });
var videoData = {
ownerUid: currentUser.uid,
publitioId: pub.publitioId,
videoUrl: pub.videoUrl,
description: desc || "",
createdAt: serverTimestamp(),
accountType: 'creator',
status: 'published',
validViews: 0
};
if (pub.thumbnailUrl) videoData.thumbnailUrl = pub.thumbnailUrl;
Object.keys(videoData).forEach(function(k) { if (videoData[k] === undefined) delete videoData[k]; });
await addDoc(collection(db, 'videos'), videoData);
toast('✅ Vidéo publiée !');
setTimeout(function() { switchTab('feed'); }, 500);
} catch (e) {
errBox.textContent = e.message || 'Échec du téléversement.';
errBox.style.display = 'block';
} finally {
btn.disabled = false;
btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publier la vidéo';
}
};

function renderVideoCard(v, mode) {
var dateStr = 'Récemment';
if (v.createdAt && v.createdAt.seconds) {
var d = new Date(v.createdAt.seconds * 1000);
dateStr = d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}
var delBtn = mode === 'mine'
? '<button onclick="supprimerVideo(\'' + v.id + '\')" style="margin-top:10px;padding:10px 16px;border-radius:10px;background:#ef4444;color:#fff;border:none;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;width:100%"><i class="fa-solid fa-trash"></i> Supprimer</button>'
: '';
var posterAttr = v.thumbnailUrl ? ' poster="' + esc(v.thumbnailUrl) + '"' : '';
var initials = (v.ownerEmail || 'N').slice(0, 2).toUpperCase();
var incBtn = mode === 'feed'
? '<button class="btn-inc-view" onclick="incrementerVue(\'' + v.id + '\',event)"><i class="fa-solid fa-eye"></i><span>+1</span></button>'
: '';
if (mode === 'mine') {
return (
'<div class="card" style="margin-bottom:16px;padding:14px">' +
'<div style="display:flex;gap:12px;align-items:center">' +
'<div style="width:64px;height:80px;border-radius:8px;background:#0f172a;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center">' +
(v.thumbnailUrl ? '<img src="' + esc(v.thumbnailUrl) + '" style="width:100%;height:100%;object-fit:cover">' : '🎬') +
'</div>' +
'<div style="flex:1;min-width:0">' +
'<p style="font-size:13px;font-weight:700;color:#0f172a;line-height:1.4;margin:0 0 6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">' + esc(v.description || 'Sans description') + '</p>' +
'<div style="font-size:11.5px;color:#64748b;font-weight:700"><i class="fa-solid fa-eye"></i> ' + (v.validViews || 0) + '</div>' +
'</div>' +
'</div>' +
delBtn +
'</div>'
);
}
return (
'<div class="video-card">' +
'<div class="video-frame">' +
'<video src="' + esc(v.videoUrl) + '"' + posterAttr + ' loop muted playsinline webkit-playsinline preload="metadata" data-vid="' + v.id + '"></video>' +
'<div class="play-overlay" data-overlay="' + v.id + '" onclick="demarrerLecture(this)">' +
'<div class="play-btn">▶</div>' +
'</div>' +
incBtn +
'<div class="feed-overlay">' +
'<div class="feed-user">' +
'<div class="feed-avatar">' + esc(initials) + '</div>' +
'<div style="min-width:0">' +
'<div class="feed-user-name">' + esc(v.ownerEmail || 'Utilisateur') + '</div>' +
'<div class="feed-user-date">' + dateStr + '</div>' +
'</div>' +
'</div>' +
(v.description ? '<p class="feed-desc">' + esc(v.description) + '</p>' : '') +
'<div class="feed-views"><i class="fa-solid fa-eye"></i> <span data-views="' + v.id + '">' + (v.validViews || 0) + '</span> vue' + ((v.validViews || 0) === 1 ? '' : 's') + '</div>' +
'</div>' +
'</div>' +
'</div>'
);
}

window.incrementerVue = async function(videoId, event) {
event.stopPropagation();
if (!currentUser) return;
var btn = event.currentTarget;
btn.disabled = true;
try {
await updateDoc(doc(db, 'videos', videoId), { validViews: increment(1) });
toast('+1 vue');
} catch (e) {
toast('Erreur');
} finally {
setTimeout(function() { btn.disabled = false; }, 800);
}
};

window.demarrerLecture = function(overlay) {
var vid = overlay.getAttribute('data-overlay');
var video = document.querySelector('video[data-vid="' + vid + '"]');
if (!video) return;
overlay.classList.remove('visible');
video.muted = false;
video.play().catch(function() {
video.muted = true;
video.play().catch(function() {
overlay.classList.add('visible');
});
});
};

function attachPauseObserver() {
if (videoObserver) videoObserver.disconnect();
if (!('IntersectionObserver' in window)) return;
videoObserver = new IntersectionObserver(function(entries) {
entries.forEach(function(e) {
var video = e.target;
var vid = video.getAttribute('data-vid');
var overlay = document.querySelector('.play-overlay[data-overlay="' + vid + '"]');
if (e.isIntersecting) {
video.muted = true;
var p = video.play();
if (p && p.then) {
p.then(function() {
if (overlay) overlay.classList.remove('visible');
}).catch(function() {
if (overlay) overlay.classList.add('visible');
});
}
} else {
if (!video.paused) video.pause();
}
});
}, { threshold: 0.6 });
document.querySelectorAll('.video-frame video').forEach(function(v) {
videoObserver.observe(v);
var vid = v.getAttribute('data-vid');
var overlay = document.querySelector('.play-overlay[data-overlay="' + vid + '"]');
if (!overlay) return;
if (v.paused) overlay.classList.add('visible');
v.addEventListener('playing', function() { overlay.classList.remove('visible'); });
v.addEventListener('pause', function() { overlay.classList.add('visible'); });
v.addEventListener('click', function(e) {
e.stopPropagation();
if (v.paused) {
v.muted = false;
v.play().catch(function() {});
} else {
v.pause();
}
});
});
}

function startFeed() {
var el = document.getElementById('feedListe');
el.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8"><i class="fa-solid fa-spinner fa-spin"></i></div>';
if (unsubFeed) { unsubFeed(); unsubFeed = null; }
var q = query(collection(db, 'videos'), orderBy('createdAt', 'desc'), limit(50));
unsubFeed = onSnapshot(q, function(snap) {
var list = [];
snap.forEach(function(d) { list.push(Object.assign({ id: d.id }, d.data())); });
if (list.length === 0) {
el.innerHTML = '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;padding:20px;text-align:center"><div style="font-size:64px;margin-bottom:16px">🎬</div><h2 style="color:#f1f5f9;font-size:18px;margin:0 0 8px">Aucune vidéo</h2><p style="font-size:14px;margin:0">Soyez le premier à publier !</p></div>';
return;
}
el.innerHTML = list.map(function(v) { return renderVideoCard(v, 'feed'); }).join('');
attachPauseObserver();
}, function(err) {
el.innerHTML = '<div style="padding:40px;color:#ef4444;text-align:center">Erreur de chargement</div>';
});
}

window.supprimerVideo = async function(videoId) {
if (!confirm('Supprimer cette vidéo ?')) return;
try { await deleteDoc(doc(db, 'videos', videoId)); toast('Vidéo supprimée'); }
catch (e) { toast('Erreur'); }
};

function startMyVideos() {
var el = document.getElementById('mesVideosListe');
if (!currentUser) { el.innerHTML = ''; return; }
el.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b"><i class="fa-solid fa-spinner fa-spin"></i></div>';
if (unsubMine) { unsubMine(); unsubMine = null; }
var q = query(collection(db, 'videos'), where('ownerUid', '==', currentUser.uid));
unsubMine = onSnapshot(q, function(snap) {
var list = [];
snap.forEach(function(d) { list.push(Object.assign({ id: d.id }, d.data())); });
list.sort(function(a, b) { return (b.createdAt && b.createdAt.seconds || 0) - (a.createdAt && a.createdAt.seconds || 0); });
if (list.length === 0) {
el.innerHTML = '<div style="text-align:center;padding:40px 20px;background:#fff;border-radius:12px;border:1px dashed #cbd5e1"><div style="font-size:48px;opacity:.4;margin-bottom:12px">📹</div><p style="font-size:14px;color:#64748b;margin:0">Aucune vidéo publiée</p></div>';
return;
}
el.innerHTML = list.map(function(v) { return renderVideoCard(v, 'mine'); }).join('');
}, function(err) {
el.innerHTML = '<div class="error-box">Erreur de chargement</div>';
});
}

onAuthStateChanged(auth, function(user) {
currentUser = user;
if (user) {
showPage('feed');
document.getElementById('tabBar').style.display = 'grid';
document.getElementById('profilEmail').textContent = user.email;
switchTab('feed');
} else {
showPage('auth');
document.getElementById('tabBar').style.display = 'none';
if (unsubFeed) { unsubFeed(); unsubFeed = null; }
if (unsubMine) { unsubMine(); unsubMine = null; }
}
});
</script>
