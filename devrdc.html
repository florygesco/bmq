<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Feed - 80/20 + Boutons</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-app: #f5f8ff;
    --bg-card: #ffffff;
    --bg-card-soft: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-muted: #64748b;
    --border-primary: #e2e8f0;
    --accent-blue: #0055ff;
  }

  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-app);
    color: var(--text-primary);
    margin: 0;
    padding: 16px 0;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 16px;
  }

  h2 {
    font-size: 18px;
    font-weight: 900;
    color: var(--text-primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .feed-split {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ===== LA CARTE ===== */
  .post-split {
    display: flex;
    flex-direction: column; /* Les boutons vont en dessous */
    background: var(--bg-card);
    border-radius: 16px;
    border: 1px solid var(--border-primary);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .post-split:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(10, 37, 64, 0.08);
  }

  /* Zone image + texte */
  .post-split-top {
    display: flex;
    flex-direction: row;
    height: 180px; /* Hauteur de la zone visuelle */
  }

  /* 🌟 L'IMAGE PREND 80% DE LA LARGEUR */
  .post-split-img {
    width: 80%; 
    height: 100%;
    background: var(--bg-card-soft);
    flex-shrink: 0;
    position: relative;
  }

  .post-split-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .post-split-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 9px;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  /* ===== LE CONTENU (20% de la largeur) ===== */
  .post-split-content {
    flex: 1;
    padding: 8px; /* Padding très réduit vu la petite taille */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    background: var(--bg-card);
  }

  /* Le prix en haut du 20% */
  .post-split-price {
    font-size: 13px;
    font-weight: 900;
    color: var(--accent-blue);
    line-height: 1.2;
    word-break: break-word;
  }

  /* Infos compactes en bas du 20% */
  .post-split-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .post-split-views {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .post-split-author {
    font-size: 9px;
    font-weight: 800;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== LES 2 BOUTONS EN BAS ===== */
  .post-split-actions {
    display: flex;
    border-top: 1px solid var(--border-primary);
  }

  .post-split-btn {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.2s ease;
  }

  .post-split-btn.share {
    color: var(--text-secondary);
    border-right: 1px solid var(--border-primary);
  }

  .post-split-btn.share:hover { background: var(--bg-card-soft); }

  .post-split-btn.unlock {
    color: var(--accent-blue);
    background: rgba(0, 85, 255, 0.04);
  }

  .post-split-btn.unlock:hover { background: rgba(0, 85, 255, 0.1); }


  /* Responsive desktop */
  @media(min-width: 768px) {
    .container { max-width: 900px; }
    .feed-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .post-split-top { height: 200px; }
    .post-split-price { font-size: 14px; }
  }

  /* Animation */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .post-split {
    animation: slideUp 0.4s ease forwards;
    opacity: 0;
  }
  .post-split:nth-child(1) { animation-delay: 0.05s; }
  .post-split:nth-child(2) { animation-delay: 0.10s; }
  .post-split:nth-child(3) { animation-delay: 0.15s; }
  .post-split:nth-child(4) { animation-delay: 0.20s; }
  .post-split:nth-child(5) { animation-delay: 0.25s; }
</style>
</head>
<body>

</html>
